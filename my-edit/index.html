<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Edit</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #playButton {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            padding: 16px 30px;
            border: none;
            border-radius: 50px;

            background: white;
            color: black;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
            z-index: 10;

            box-shadow: 0 0 30px rgba(255,255,255,0.4);
        }

        #playButton.hidden {
            display: none;
        }
    </style>
</head>

<body>

    <video id="edit" playsinline>
        <source src="edit.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <button id="playButton">
        ▶ Tap to Play
    </button>

    <script>
        const video = document.getElementById("edit");
        const button = document.getElementById("playButton");

        // Try autoplay WITH SOUND
        video.muted = false;

        video.play()
            .then(() => {
                button.classList.add("hidden");
            })
            .catch(() => {
                // Browser blocked autoplay with sound
                button.classList.remove("hidden");
            });

        // User taps button
        button.addEventListener("click", async () => {
            try {
                video.muted = false;
                await video.play();

                button.classList.add("hidden");

                // Try fullscreen on mobile
                if (video.requestFullscreen) {
                    video.requestFullscreen().catch(() => {});
                }
            } catch (error) {
                console.log("Video could not play:", error);
            }
        });
    </script>

</body>
</html>
