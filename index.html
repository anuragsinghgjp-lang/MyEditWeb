<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Edit</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #playButton {
            position: fixed;
            z-index: 10;
            padding: 18px 35px;
            border: none;
            border-radius: 50px;
            background: white;
            color: black;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #error {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            color: white;
            text-align: center;
            font-family: Arial;
            display: none;
        }
    </style>
</head>

<body>

    <video id="video" playsinline preload="auto">
        <source src="./edit.mp4" type="video/mp4">
    </video>

    <button id="playButton">▶ TAP TO PLAY</button>

    <div id="error">
        Video load nahi ho rahi. Check karo ki file ka naam <b>edit.mp4</b> hai.
    </div>

    <script>
        const video = document.getElementById("video");
        const button = document.getElementById("playButton");
        const error = document.getElementById("error");

        // Page open hote hi sound ke saath play try
        video.muted = false;

        video.play().then(() => {
            button.style.display = "none";
        }).catch(() => {
            // Browser ne sound autoplay block kiya
            button.style.display = "block";
        });

        // TAP TO PLAY
        button.addEventListener("click", async function () {

            try {
                video.muted = false;
                video.volume = 1.0;

                await video.play();

                button.style.display = "none";

            } catch (e) {
                console.log(e);

                error.innerHTML =
                    "Video play nahi ho pa rahi. Video file/check karo.";
                error.style.display = "block";
            }
        });

        // Video missing/error
        video.addEventListener("error", function () {
            error.style.display = "block";
        });
    </script>

</body>
</html>
